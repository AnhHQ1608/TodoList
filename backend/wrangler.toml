name = "focus-list-activity"
main = "worker.mjs"
compatibility_date = "2026-01-01"
workers_dev = true

[vars]
REQUIRE_ACCOUNT = "true"
ALLOWED_ORIGIN = "https://anhhq1608.github.io"

[[d1_databases]]
binding = "DB"
database_name = "focus-list-activity"
# Database D1 của backend lịch sử hoạt động.
database_id = "d6fcab14-79de-4a1d-99a2-f466925fe116"

[triggers]
crons = ["0 3 * * *"]

# Tắt log ứng dụng; không ghi password, IP hay nội dung request.
[observability]
enabled = false
